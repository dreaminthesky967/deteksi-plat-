<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deteksi Plat Nomor</title>
<style>
:root{--bg:#e9edf0;--surface:#fff;--ink:#16252e;--muted:#5d6f7a;--line:#cdd6db;--accent:#0b6e8a;--plate:#111}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 300px}
@media(max-width:820px){main{grid-template-columns:1fr}}
h1{grid-column:1/-1;margin:0;font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.view{min-height:320px;display:grid;place-items:center;background:#0e171c;border-radius:4px;overflow:hidden}
.view img{width:100%;display:block}
.hint{color:#9fb1ba;padding:24px;text-align:center}
label{display:block;font-weight:600;margin:14px 0 6px}
select,input[type=text],input[type=file]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:4px;font:inherit;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px;margin-top:16px}
button{flex:1;padding:10px;border:0;border-radius:4px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
button.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid #f2b400;outline-offset:2px}
.stat{color:var(--muted);font-size:.9rem;margin-top:12px}
.plate{background:var(--plate);color:#fff;border:3px solid #fff;outline:2px solid var(--plate);border-radius:8px;padding:10px 12px 6px;text-align:center;margin-top:10px}
.plate b{display:block;font-size:1.7rem;letter-spacing:.08em;font-family:"Arial Narrow",Arial,sans-serif}
.plate span{font-size:.95rem;letter-spacing:.1em;border-top:1px solid #fff;display:block;margin-top:4px;padding-top:2px}
.empty{color:var(--muted);margin:10px 0 0}
#err{color:#b3261e;margin-top:10px;min-height:1.2em}
</style>
</head>
<body>
<main>
  <h1>Deteksi Plat Nomor</h1>

  <section class="panel">
    <div class="view">
      <img id="feed" alt="Hasil deteksi langsung" hidden>
      <img id="shot" alt="Hasil deteksi gambar" hidden>
      <p class="hint" id="hint">Pilih sumber di sebelah kanan, lalu klik Mulai.</p>
    </div>
  </section>

  <aside class="panel">
    <label for="kind">Sumber</label>
    <select id="kind">
      <option value="webcam">Webcam laptop</option>
      <option value="youtube">Live stream YouTube</option>
      <option value="image">Upload gambar</option>
    </select>

    <div id="urlBox" hidden>
      <label for="url">Link live stream YouTube</label>
      <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=...">
    </div>
    <div id="fileBox" hidden>
      <label for="file">Pilih gambar</label>
      <input id="file" type="file" accept="image/*">
    </div>

    <div class="row">
      <button id="go">Mulai</button>
      <button id="stop" class="alt">Stop</button>
    </div>
    <div id="err" role="alert"></div>

    <div class="stat" id="stat"></div>
    <label>Plat terbaca</label>
    <div id="plates"><p class="empty">Belum ada plat terdeteksi.</p></div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
const post = (u, body) => fetch(u, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
const plateHtml = p => `<div class="plate"><b>${p.plate || "?"}</b>${p.expiry ? `<span>${p.expiry}</span>` : ""}</div>`;
const showPlates = list => $("plates").innerHTML = list.length ? list.map(plateHtml).join("") : '<p class="empty">Belum ada plat terdeteksi.</p>';
let poll = null;

function show(mode){            // "feed" | "shot" | "none"
  $("feed").hidden = mode !== "feed";
  $("shot").hidden = mode !== "shot";
  $("hint").hidden = mode !== "none";
}

$("kind").onchange = () => {
  const k = $("kind").value;
  $("urlBox").hidden = k !== "youtube";
  $("fileBox").hidden = k !== "image";
};

$("go").onclick = async () => {
  $("err").textContent = "";
  const kind = $("kind").value;
  if (kind === "image") {
    const f = $("file").files[0];
    if (!f) { $("err").textContent = "Pilih file gambar dulu."; return; }
    clearInterval(poll); $("feed").removeAttribute("src");
    $("stat").textContent = "Memproses gambar...";
    const fd = new FormData(); fd.append("file", f);
    const r = await fetch("/upload", {method:"POST", body:fd});
    const d = await r.json();
    if (!r.ok) { $("err").textContent = d.error; $("stat").textContent = ""; return; }
    $("shot").src = d.image; show("shot"); showPlates(d.plates);
    $("stat").textContent = `${d.plates.length} plat terdeteksi`;
    return;
  }
  const r = await post("/source", {kind, url:$("url").value});
  if (!r.ok) { $("err").textContent = (await r.json()).error; return; }
  show("feed"); $("feed").src = "/video_feed?" + Date.now();
  clearInterval(poll);
  poll = setInterval(async () => {
    const s = await (await fetch("/status")).json();
    $("stat").textContent = `${s.msg} · ${s.fps} FPS`;
    showPlates(s.plate ? [s] : []);
  }, 700);
};

$("stop").onclick = async () => {
  clearInterval(poll);
  await post("/source", {kind:"stop"});
  $("feed").removeAttribute("src");
  show("none"); showPlates([]); $("stat").textContent = "Dihentikan";
};
</script>
</body>
</html>
